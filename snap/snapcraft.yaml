name: orbguard
base: core22
# Keep in step with app/pubspec.yaml (without the build number);
# app/tools/test_release_versions.py fails CI when they differ.
version: '1.1.0'
summary: Know if you're being watched. Anti-spyware and scam protection.
description: |
  OrbGuard checks your computer for spyware and stalkerware, analyses scam
  links, and watches for a hidden VPN or proxy. One subscription is shared
  with OrbVPN and OrbBrowser (sign in with your Orb account).
license: Proprietary
grade: stable
confinement: strict

apps:
  orbguard:
    command: orbguard
    extensions: [gnome]
    # snap/gui/orbguard.desktop (picked up by name) registers orbguard://
    # so the emailed sign-in link opens the app.
    plugs:
      - network
      - home
      - audio-playback
      # The sign-in token is kept in the desktop keyring (libsecret).
      - password-manager-service
      # The computer check reads running processes and network state.
      # Without these connected those areas say they are not possible here;
      # nothing is faked.
      - system-observe
      - network-observe

parts:
  orbguard:
    # Package the release bundle the workflow already built (flutter build
    # linux runs before snapcraft in linux-build.yml); the snapcraft flutter
    # plugin's own in-container Flutter rebuild is redundant and crashes.
    plugin: dump
    source: app/build/linux/x64/release/bundle
    # The tray icon's plugin links AppIndicator; without the library in the
    # snap the app would not start.
    stage-packages:
      - libayatana-appindicator3-1
