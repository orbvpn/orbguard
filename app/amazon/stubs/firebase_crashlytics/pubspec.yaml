# Amazon Appstore build only: a pure-Dart stand-in for firebase_crashlytics.
# No `flutter: plugin:` section and no native code, so the Amazon APK sends
# no crash reports. app/amazon/build_amazon_apk.sh points the app here
# through pubspec_overrides.yaml for one build, then removes it.
name: firebase_crashlytics
description: Amazon build stand-in, pure Dart, no native code.
version: 5.2.6
publish_to: none

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
